name: Judge Agent - Repository, Code & Domain Critique

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: judge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  judge:
    name: Run Judge Agent
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        working-directory: web
        run: npm ci

      - name: Execute Autonomous Judge Agent
        id: run_judge
        env:
          CI: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node tools/judge/judge.mjs

      - name: Upload Judge Critique Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judge-critique-report
          path: judge-report.md
          if-no-files-found: ignore
