name: Judge Agent - Repository, Code & Domain Critique

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: judge-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  judge:
    name: Run Judge Agent
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # tools/judge/judge.mjs posts a commit comment; nothing else

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        working-directory: web
        run: npm ci

      - name: Execute Autonomous Judge Agent
        id: run_judge
        env:
          CI: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node tools/judge/judge.mjs

      - name: Upload Judge Critique Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: judge-critique-report
          path: judge-report.md
          if-no-files-found: ignore
