name: Smoke test after deploy

# Vercel reports each finished deploy to GitHub as a deployment status. On
# success, GET the key pages and /api/health on that deployment's own URL
# (web/scripts/smoke.mjs). Read-only, no install step: the script has no deps.
on: deployment_status

permissions:
  contents: read

jobs:
  smoke:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Smoke test (${{ github.event.deployment_status.environment }})
        env:
          DEPLOY_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
          # Only needed while Vercel Deployment Protection guards preview URLs.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node web/scripts/smoke.mjs "$DEPLOY_URL"
