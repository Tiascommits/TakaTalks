name: CI

# Same stages as `npm run verify` (web/package.json), run against a throwaway
# Postgres service container. `main` has no GitHub branch protection (checked
# 2026-11-01); the rule is the repo's own (CLAUDE.md, git_instructions.md): work goes
# to `experimental`, which merges into `main` only after QA. This is the automatic
# gate for both.
on:
  pull_request:
    branches: [main, experimental]
  push:
    branches: [experimental]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web

    services:
      postgres:
        # Pinned by digest; refresh with `docker buildx imagetools inspect postgres:16-alpine`.
        image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway database inside the service container. `prisma migrate reset`
      # (e2e/global-setup.ts) creates and wipes it on every run.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/takatalks_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/takatalks_test
      # Dummy values: the e2e admin test needs ADMIN_SECRET set, nothing else
      # here talks to a real service. Email/WhatsApp are left unset (they no-op).
      ADMIN_SECRET: ci-only-admin-secret-not-used-anywhere-else
      CRON_SECRET: ci-only-cron-secret-not-used-anywhere-else

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Runtime dependencies only, critical only: the 4 known highs sit in build-time tooling.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npx next build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-test-results
          path: web/test-results/
          if-no-files-found: ignore
